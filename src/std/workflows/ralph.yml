# Ralph: one agent revises its complete answer for a fixed number of rounds.
# The feedback edge Ralph->Ralph is the loop; rounds and prompts are code:
#   JuncoGraph.fromYaml(workflows.ralph, { cwd, scheduler: () => schedules.parallel(),
#     ladder, ...schedules.ralph({ rounds: 3 }) });
# Feed the assignment on route `assignment`; the result is Ralph's final round.
graph:
  name: Ralph
  source:
    routes:
      assignment: ["$source~>Ralph"]
  nodes:
    Ralph:
      description: Revises its complete answer each round; only the final round reaches $sink.
      trigger:
        any: ["$source~>Ralph", "Ralph->Ralph"]
  edges:
    - from: $source
      to: Ralph
      kind: message
    - from: Ralph
      to: Ralph
    - from: Ralph
      to: $sink
