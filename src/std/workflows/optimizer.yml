# Junco profile optimizer: measures an instrumented target workflow in fresh child processes and
# has one persistent editor agent patch its scheduler, model-ladder and limit tuning regions until
# the requested stop predicates hold. Driven only by `schedules.runOptimizer`, which supplies the
# code nodes, the editor's two tools and the scheduler:
#   Init -> Evaluate -> Editor -> Feedback -> Evaluate ... -> Final -> $sink
# Every state edge carries the complete OptimizationState; the schema below is its contract.
graph:
  name: JuncoProfileOptimizer
  threads: 1
  nodes:
    Init:
      kind: code
      description: Emits the initial optimization state once.
      trigger: always
    Evaluate:
      kind: code
      description: >-
        Runs and scores the target, promotes or restores candidates, decides convergence, and
        stages the next editor assignment or the terminal state.
      trigger: { any: [initial-state, feedback-state] }
    Editor:
      description: Authors one tuning-region patch per assignment through edit_tuning.
      tool_block: [ast_edit, ast_grep, bash, code_graph, diff, edit, find, grep, read, release, task, yield, send]
      trigger: editor-assignment
      prompt: >-
        Read editTicket, request.axes[axisIndex] and cycle from the delivered editor-assignment state.
        Call read_target, then edit_tuning with that ticket and axis. Finish with one sentence.
      system: |
        You tune one existing Junco workflow for a measured objective by coordinate descent over
        its scheduler, ladder and limits tuning regions. Each turn you receive the complete
        optimization state on edge editor-assignment (delivered as the user message after each turn's instruction, as JSON { id, payload }): the request, the
        incumbent anchor with its batch statistics, every earlier trial with its measured runs and
        statistics, and every earlier edit. The host runs, measures, scores, promotes and stops;
        you never run the target and never report scores.

        Per turn:
        1. Read the state from that message. Its editTicket is your ticket. The axis is
           request.axes[axisIndex].
        2. Call read_target for the current workflow YAML and TypeScript and its tsHash.
        3. Call edit_tuning once with the ticket, that axis, expectedTsHash, the complete new
           interior of that axis's tuning region as source, and a one-line reason. If it is
           rejected, read the error, correct the patch and call it again.
        4. Finish with one short plain-text sentence describing the change.

        Change exactly one coordinate per turn: replace only the assigned region, keeping the
        other two at the incumbent's (anchor.candidate.sources). How the host decides:
        - Every batch is request.repeats fresh executions. A complete batch's stats hold each
          metric's mean and sample standard deviation; its score is the objective mean.
        - A candidate is promoted only when every run meets every constraint, neither the
          objective nor the quality constraint (constraints[request.qualityConstraint], when set)
          has a worse mean than the incumbent's, and at least one of them improves by at least
          their pooled sample standard deviation. A failed or incomplete batch retries your axis;
          an infeasible or non-improving one is restored and the next axis follows.
        - A full cycle without promotion earns a fresh confirmation; a promotion starts another
          cycle from a freshly remeasured incumbent. The host repeats measurements itself.
        - A candidate's identity is its triplet: the SHA-256 of each region's transpiled
          JavaScript, combined into candidate.key. edit_tuning rejects a key equal to the
          baseline's or to any earlier measured trial's, including failed and infeasible ones.
          Comment, spacing, quoting or type-only changes do not make a new configuration, and
          renaming or reordering an earlier proposal to evade the check is forbidden: propose a
          genuinely different configuration.
        Study earlier trials' stats, failures and errors before proposing. Write real TypeScript
        in the target's existing style, using only bindings the file already imports.

        Region bindings you must keep defining:
        - scheduler: `optimizerScheduler(label: string)` returning a fresh scheduling policy for
          the graph level `label` names; dispatch on existing labels, never rename them.
          Deterministic choices: the existing factory, `schedules.parallel()`,
          `schedules.roundRobin(undefined, width)`, `schedules.choose({ rank, width })` whose rank
          may read `snapshot.history` (compute per-snapshot selection counts once and cache them,
          e.g. to favor less-selected work, rather than rescanning history per comparison) and
          whose width bounds concurrency, or `schedules.separate(leftOwns, left, right)` giving
          complementary ownership to two policies, e.g. one existing role you inspected on
          `schedules.roundRobin(undefined, 1)` and all other work on another
          `schedules.roundRobin(undefined, 1)`. Widths of separated branches add up, so the
          graph's capacity must allow the combined width, and the two branches together must
          keep all required work schedulable; separation is no fairness or capacity guarantee.
          `schedules.lowest(kind)` and `schedules.highest(kind)` are rank callbacks for choose,
          not schedulers. They compare the latest observations in `snapshot.measurements`; use
          a resource the target collects through `measurementWindows`, never invented samples.
          Keep ties deterministic, progress guaranteed and combined concurrency bounded. Cheap
          `schedules.pi` runs only through the target's fixed `optimizerPi` wrapper, never as the
          default replacement for deterministic policies. That wrapper alone owns model/thinking
          authorization against request.allowedModels and records every returned usage before
          stop-reason or scheduling-output validation; never bypass or replace it. Use only the
          exact authorized model/thinking pairs, just as for ladder rungs. Unknown request usage
          invalidates the run. Never change model rungs from this region, omit required work
          (a bare `where` or partial node list must not drop any), or make any existing ready
          work node unschedulable; scheduling changes only its order or concurrency.
        - ladder: `optimizerLadder` (a complete ladder with smol, low, med, high and xhigh rungs,
          each `{ model: "provider/model-id", thinking? }`, or undefined for a deterministic
          target) and `optimizerStrength` (a `(snapshot, nodeId) => rung-name` selector, or
          undefined to keep the base policy's "med" rung). Use only model/thinking pairs listed
          in request.allowedModels, and change rungs that target work actually uses.
        - limits: `optimizerLimits: { memoryBytes?, tokens?, tools?, scope? }` with nonnegative
          numbers within request.limitBounds (a missing bound is no numeric upper bound) and
          scope "evaluation" (the default: one run() or step() drive), "batch" (one selected
          decision) or "activation" (one node prime or resume, not an agent's lifetime). Memory
          admission uses retained peaks; an unknown node without a calibrated floor runs alone.
          Tokens and tools cap actual usage. For a tool-using cost workload consider a `tools`
          cap first: it counts every admitted graph-agent tool call together, including
          coordination and inherited task-child calls, but not yours. A denied call never
          executes and fails its run, so the batch is invalid,
          never a cheap success. Tighten caps that succeeded and bracket later proposals with
          lower caps that failed; a smaller cap does not necessarily save cost. The target keeps
          its original hard limits outside your region.

        Never put region marker comments or NUL characters in source, never resubmit the
        incumbent bytes unchanged, and never edit anything outside the assigned region.
    Feedback:
      kind: code
      description: Records the settled editor turn's receipt as an edit outcome.
      trigger: { all: [awaiting-edit, editor-complete] }
    Final:
      kind: code
      description: Returns the terminal optimization state.
      trigger: terminal-state
  edges:
    - id: initial-state
      from: Init
      to: Evaluate
      kind: message
      schema: &state
        type: object
        additionalProperties: false
        required:
          - request
          - current
          - anchor
          - baselineScore
          - graphHash
          - cycle
          - axisIndex
          - cycleImproved
          - explored
          - stableValues
          - editTicket
          - history
          - stop
        properties:
          request:
            type: object
            additionalProperties: false
            required:
              - target
              - sessionDir
              - workloadId
              - objective
              - constraints
              - repeats
              - stop
              - axes
              - allowedModels
              - limitBounds
            properties:
              target:
                type: object
                additionalProperties: false
                required: [yaml, ts, cwd, argv]
                properties:
                  yaml: { type: string, minLength: 1 }
                  ts: { type: string, minLength: 1 }
                  cwd: { type: string, minLength: 1 }
                  argv: &argv
                    type: array
                    minItems: 1
                    items: { type: string, minLength: 1 }
                  resetArgv: *argv
              sessionDir: { type: string, minLength: 1 }
              workloadId: { type: string, minLength: 1 }
              objective:
                type: object
                additionalProperties: false
                required: [metric, direction]
                properties:
                  metric: &metric
                    anyOf:
                      - type: object
                        additionalProperties: false
                        required: [kind]
                        properties:
                          kind: { enum: [tokens, memory, cost] }
                      - type: object
                        additionalProperties: false
                        required: [kind, name]
                        properties:
                          kind: { const: result }
                          name: { type: string, minLength: 1 }
                      - type: object
                        additionalProperties: false
                        required: [kind, node, edgeId, reduce]
                        properties:
                          kind: { const: probe }
                          node: { type: string }
                          edgeId: { type: string, minLength: 1 }
                          reduce: { enum: [single, last, min, max, sum, mean] }
                  direction: { enum: [minimize, maximize] }
              constraints:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [metric, op, threshold]
                  properties:
                    metric: *metric
                    op: { enum: ["<=", ">="] }
                    threshold: { type: number }
              qualityConstraint: { type: integer, minimum: 0 }
              repeats: { type: integer, minimum: 2 }
              stop:
                type: object
                additionalProperties: false
                minProperties: 1
                properties:
                  target: { type: number }
                  improvement:
                    type: object
                    additionalProperties: false
                    required: [kind, value]
                    properties:
                      kind: { enum: [absolute, relative] }
                      value: { type: number, exclusiveMinimum: 0 }
                  plateau:
                    type: object
                    additionalProperties: false
                    required: [window, absoluteTolerance, relativeTolerance]
                    properties:
                      window: { type: integer, minimum: 2 }
                      absoluteTolerance: { type: number, minimum: 0 }
                      relativeTolerance: { type: number, minimum: 0 }
              axes:
                type: array
                minItems: 1
                uniqueItems: true
                items: &axis { enum: [scheduler, ladder, limits] }
              allowedModels:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [model]
                  properties:
                    model: { type: string, pattern: "^[^/]+/.+$" }
                    thinking: { enum: [minimal, low, medium, high, xhigh, max] }
              limitBounds:
                type: object
                additionalProperties: false
                properties:
                  memoryBytes: { type: number, minimum: 0 }
                  tokens: { type: number, minimum: 0 }
                  tools: { type: integer, minimum: 0 }
              runBudget: { type: integer, minimum: 1 }
              timeBudgetMs: { type: integer, minimum: 1 }
          current: &candidate
            type: object
            additionalProperties: false
            required: [sources, triplet, key, tsHash]
            properties:
              sources:
                type: object
                additionalProperties: false
                required: [scheduler, ladder, limits]
                properties:
                  scheduler: { type: string }
                  ladder: { type: string }
                  limits: { type: string }
              tsHash: &hash { type: string, pattern: "^[0-9a-f]{64}$" }
              triplet:
                type: object
                additionalProperties: false
                required: [ladder, scheduler, limits]
                properties:
                  ladder: *hash
                  scheduler: *hash
                  limits: *hash
              key: *hash
          anchor:
            type: object
            additionalProperties: false
            required: [candidate, score, stats]
            properties:
              candidate: *candidate
              score: &score { type: [number, "null"] }
              stats: &stats
                anyOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [objective, constraints]
                    properties:
                      objective: &distribution
                        type: object
                        additionalProperties: false
                        required: [mean, standardDeviation, repeats]
                        properties:
                          mean: { type: number }
                          standardDeviation: { type: number, minimum: 0 }
                          repeats: { type: integer, minimum: 2 }
                      constraints: { type: array, items: *distribution }
          baselineScore: *score
          graphHash: { anyOf: [*hash, { type: "null" }] }
          cycle: { type: integer, minimum: 0 }
          axisIndex: { type: integer, minimum: 0 }
          cycleImproved: { type: boolean }
          explored: { type: array, uniqueItems: true, items: *axis }
          stableValues: { type: array, items: { type: number } }
          editTicket: { type: [string, "null"] }
          history:
            type: array
            items:
              anyOf:
                - type: object
                  additionalProperties: false
                  required: [kind, phase, axis, candidate, runs, stats, score, feasible]
                  properties:
                    kind: { const: trial }
                    phase: { enum: [baseline, candidate, remeasure, confirmation] }
                    axis: { enum: [scheduler, ladder, limits, null] }
                    candidate: *candidate
                    runs:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [run, directory, status, objective, constraints, error]
                        properties:
                          run: { type: integer, minimum: 1 }
                          directory: { type: string }
                          status: { enum: [running, ok, failed, cancelled] }
                          objective: &summary
                            anyOf:
                              - type: object
                                additionalProperties: false
                                required: [value, unit, count]
                                properties:
                                  value: { type: number }
                                  unit: { enum: [tok, B, USD, null] }
                                  count: { type: integer, minimum: 1 }
                              - type: "null"
                          constraints: { type: array, items: *summary }
                          error: &text { type: [string, "null"] }
                    stats: *stats
                    score: *score
                    feasible: { type: boolean }
                - type: object
                  additionalProperties: false
                  required:
                    [kind, ticket, axis, beforeHash, afterHash, source, reason, accepted, error]
                  properties:
                    kind: { const: edit }
                    ticket: { type: string }
                    axis: *axis
                    beforeHash: *hash
                    afterHash: { anyOf: [*hash, { type: "null" }] }
                    source: *text
                    reason: { type: string }
                    accepted: { type: boolean }
                    error: *text
          stop:
            anyOf:
              - type: "null"
              - type: object
                additionalProperties: false
                required: [kind, reason]
                properties:
                  kind: { enum: [converged, cancelled, budget, blocked, failed] }
                  reason: { type: string }
    - id: feedback-state
      from: Feedback
      to: Evaluate
      kind: message
      schema: *state
    - id: editor-assignment
      from: Evaluate
      to: Editor
      kind: message
      schema: *state
    - id: awaiting-edit
      from: Evaluate
      to: Feedback
      kind: message
      schema: *state
    - id: editor-complete
      from: Editor
      to: Feedback
      kind: message
      on: return
      schema:
        type: object
        required: [role, content, stopReason]
        properties:
          role: { const: assistant }
          content:
            type: array
            items:
              anyOf:
                - type: object
                  required: [type, text]
                  properties: { type: { const: text }, text: { type: string } }
                - type: object
                  required: [type, thinking]
                  properties: { type: { const: thinking }, thinking: { type: string } }
                - type: object
                  required: [type, id, name, arguments]
                  properties:
                    type: { const: toolCall }
                    id: { type: string }
                    name: { type: string }
                    arguments: { type: object }
          stopReason: { enum: [pending, stop, length, toolUse, error, aborted, deferred] }
          errorMessage: { type: string }
    - id: terminal-state
      from: Evaluate
      to: Final
      kind: message
      schema: *state
    - id: result
      from: Final
      to: $sink
      schema: *state
