graph:
  name: Audit
  nodes:
    Collect: { kind: code, trigger: always }
    Review:
      kind: graph
      graph:
        name: Review
        source: { routes: { "Collect->Review": ["$source~>Check"] } }
        nodes:
          Check:
            prompt: Run the repository checks with bash and report findings.
            tools: [bash]
          Score: { kind: code }
        edges:
          - { from: $source, to: Check, kind: message, schema: { type: string } }
          - { from: Check, to: Score, schema: { type: object } }
          - { id: quality, from: Score, to: $sink, schema: { type: number } }
    Publish: { kind: code }
  edges:
    - { from: Collect, to: Review, schema: { type: string } }
    - { from: Review, to: Publish, schema: { type: number } }
    - { from: Publish, to: $sink, schema: { type: number } }
