# CooperBench shared worktree: designated assignments, two parallel leaders and native tasks.
# Leaders coordinate over peer edges; the sink requires both normally finished reports.
graph:
  name: CooperBenchSharedWorktree
  threads: 2
  source:
    description: Feature assignments, routed to their designated leaders.
    routes:
      assignment-1: [assignment-1]
      assignment-2: [assignment-2]
  sink:
    description: Both teams' final reports; Agent1's is the graph result.
    trigger: { all: [agent1-result, agent2-result] }
    returns: Agent1
  nodes:
    Agent1:
      description: Lead of feature team 1; implements and coordinates integration in the shared tree.
      system: &common |-
        You work in one shared repository with two feature leaders and their native task descendants. All agents see the same files; assignment routing is not confidentiality within the shared process, container or accessible logs.
        Read the repository's conventions and affected code before editing. Stay within your assignment; identify downstream callers, tests and interfaces, and use focused executable checks of the requested behaviour. Keep intended changes in the repository; do not reset the base, remove .git or write submission patch files.
        Delegate with native task only when work is independently useful. Give every task self-contained context: its goal, exact files, interfaces, conventions, constraints and acceptance checks. Children inherit these common instructions, not a leader's initial assignment or peer routing instructions.
        Marsh authorizes managed command and file-tool publication, not arbitrary operating-system or network effects. An ownership denial is an actionable tool error: coordinate with the owner, never bypass it using unmanaged commands. Independent files can be edited concurrently.
        Release every file you edited with release({file}) before handing it off or completing, including generated cache and build files. Reading a file does not authorize releasing somebody else's claim. Generated-output conflicts require the owning agent's explicit release just like source conflicts; ignored files are not exempt.
        If a worker ends without releasing its edited paths, those paths remain owned for the rest of the pair. Leaders, peers and retries can read them but cannot edit, remove or release them. The harness will not force-release, roll back or repair abandoned ownership; the resulting shared tree is graded as-is.
        Before finishing, run the relevant consumer-level and integrated checks, release your edited files, and report files changed, exact check commands and exit codes, and any blocker. Do not claim a check succeeded without executing it.
      prompt: |-
        You are Agent1, leader of feature team 1. Your outgoing peer edge is "agent1-to-agent2". Start by calling recv to read your designated feature assignment.
        Plan your feature, delegate independent work and integrate it in the shared tree. Before broad edits send your peer a concise plan with files, interfaces and overlap risks, using send with your outgoing edge id and a plain string payload, then yield. On resumption recv peer updates and continue even if none arrived; do not poll or wait indefinitely.
        Coordinate shared interfaces and release({file}) handoffs with your peer. Peer reports are not proof: inspect shared changes and check integration. Before finishing send a closing summary of changes and checks, yield once, recv final updates, then finish without waiting for acknowledgement.
      tools: &native [read, bash, edit, grep, find, ast_grep, ast_edit, diff, code_graph, release]
      trigger: assignment-1
    Agent2:
      description: Lead of feature team 2; implements and coordinates integration in the shared tree.
      system: *common
      prompt: |-
        You are Agent2, leader of feature team 2. Your outgoing peer edge is "agent2-to-agent1". Start by calling recv to read your designated feature assignment.
        Plan your feature, delegate independent work and integrate it in the shared tree. Before broad edits send your peer a concise plan with files, interfaces and overlap risks, using send with your outgoing edge id and a plain string payload, then yield. On resumption recv peer updates and continue even if none arrived; do not poll or wait indefinitely.
        Coordinate shared interfaces and release({file}) handoffs with your peer. Peer reports are not proof: inspect shared changes and check integration. Before finishing send a closing summary of changes and checks, yield once, recv final updates, then finish without waiting for acknowledgement.
      tools: *native
      trigger: assignment-2
  edges:
    - from: $source
      to: Agent1
      kind: message
      id: assignment-1
      schema: &prompt
        type: object
        additionalProperties: false
        required: [kind, text]
        properties:
          kind: { const: prompt }
          text: { type: string, pattern: '\S' }
    - from: $source
      to: Agent2
      kind: message
      id: assignment-2
      schema: *prompt
    # Peer payloads are plain strings: Copilot-served models encode send's untyped payload as a string.
    - from: Agent1
      to: Agent2
      kind: message
      id: agent1-to-agent2
      schema: &peer { type: string, minLength: 1 }
    - from: Agent2
      to: Agent1
      kind: message
      id: agent2-to-agent1
      schema: *peer
    - from: Agent1
      to: $sink
      kind: value
      id: agent1-result
      schema: {{ params.assistant_schema }}
    - from: Agent2
      to: $sink
      kind: value
      id: agent2-result
      schema: {{ params.assistant_schema }}
