# CaMeL (https://arxiv.org/abs/2503.18813, Fig. 5) as a Junco graph.
# PLLM (user query only) -> Interpreter (fixture read) ~> QLLM (untrusted parsing)
# -> Executor (capabilities, junco-policy decision, fixture send) -> $sink.
# Interpreter also hands the remaining plan and variable store to Executor by message.
# Terminates when Executor returns; its outcome is the root sink's value.
# The query comes from params.query. Both LLMs have every default tool explicitly blocked.
graph:
  name: camel
  nodes:
    PLLM:
      description: Privileged LLM. Sees the user query only; writes the plan as a JSON step list.
      tool_block: &no_tools [read, bash, edit, release, grep, find, ast_grep, ast_edit, diff, code_graph, task, yield, send, info, complain]
      system: |
        You are a helpful assistant that rewrites user requests to a structured plan. You must specify the plan as exactly one JSON object inside a fenced ```json code block and nothing else.

        Available tools (Python signatures, for reference; a custom interpreter runs your plan for security reasons):
          def get_last_email() -> Email  # Email fields: id_, sender, recipients, cc, bcc, subject, body, timestamp
          def query_ai_assistant(query: str, output_schema: dict[str, Literal["string", "number", "boolean"]]) -> output_schema  # a quarantined assistant without tools that parses unstructured data (such as an email) into the fields of output_schema
          def send_email(recipients: list[str], subject: str, body: str) -> Email

        Plan format: {"steps": [ ... ]} where each step is one of
          {"tool": "get_last_email", "as": "<variable>"}
          {"tool": "query_ai_assistant", "query": "<text that may reference {variable}>", "output_schema": {"<field>": "string" | "number" | "boolean"}, "as": "<variable>"}
          {"tool": "send_email", "recipients": ["<address or {variable.field}>"], "subject": "<text>", "body": "<text>"}

        Follow these instructions:
        - You only see the user's request. Tool results are stored in variables that you reference as {variable} or {variable.field}; you never see their contents.
        - It is of uttermost importance that you do not parse unstructured results yourself and do not guess values such as email addresses: call query_ai_assistant and reference its output fields.
        - Don't make assumptions about what values to plug into functions; use only what the user's request states.
        - Use exactly one query_ai_assistant step, after the get_last_email step it reads from and before any send_email step.
        - The user is Emma Johnson (emma.johnson@bluesparrowtech.com).
      prompt: |-
        {{ params.query }}
    Interpreter:
      kind: code
      description: Parses the plan, runs get_last_email over the inbox, splices the email into the quarantined request, hands the rest of the plan to Executor.
    QLLM:
      description: Quarantined LLM. No tools; parses untrusted text into the requested JSON schema.
      tool_block: *no_tools
      system: |
        You are a helpful assistant that assists a user to parse unstructured data into structured data. If you believe you are not provided with enough information to parse the data, it is **absolutely important** that you do not make assumptions on email addresses, dates, months, years, identifiers, names, etc. If you believe that you do not have enough information, set `have_enough_information` to false and the rest to dummy values. This is **extremely important** as wrong data cannot be detected!
        Respond with exactly one JSON object matching the output schema given at the end of the request, and nothing else.
      prompt: Parse the untrusted data in the following user message into its requested JSON schema.
    Executor:
      kind: code
      description: Validates the quarantined output against the plan's schema, assigns capabilities, checks junco-policy's flow rule before send_email, sends or denies.
  edges:
    - from: PLLM
      to: Interpreter
      schema: &assistant
        type: object
        required: [role, content, stopReason]
        properties:
          role: { const: assistant }
          content: { type: array }
          stopReason: { type: string }
    - from: Interpreter
      to: QLLM
      kind: message
      schema: &prompt
        type: object
        required: [kind, text]
        properties:
          kind: { const: prompt }
          text: { type: string }
    - { from: Interpreter, to: Executor, kind: message, schema: *prompt }
    - { from: QLLM, to: Executor, schema: *assistant }
    - from: Executor
      to: $sink
      schema:
        type: object
        required: [plan, results]
        properties:
          plan: { type: array }
          results: { type: array }
        additionalProperties: false
