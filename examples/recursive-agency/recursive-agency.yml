graph:
  name: root
  nodes:
    Start: { kind: code, trigger: always }
    "0":
      kind: graph
      trigger: Start->0
      description: root member 0
      graph:
        name: child
        source:
          routes: { "Start->0": [] }
        nodes:
          "0":
            kind: graph
            trigger: always
            description: child member 0
            graph:
              name: grandchild
              nodes:
                "0":
                  system: leaf
                  prompt: Do your part.
                  description: grandchild member 0
                  trigger: always
              edges:
                - from: "0"
                  to: $sink
                  schema: &assistant
                    type: object
                    required: [role, content, stopReason]
                    properties:
                      role: { const: assistant }
                      content:
                        type: array
                        items:
                          anyOf:
                            - type: object
                              required: [type, text]
                              properties: { type: { const: text }, text: { type: string } }
                            - type: object
                              required: [type, thinking]
                              properties: { type: { const: thinking }, thinking: { type: string } }
                            - type: object
                              required: [type, id, name, arguments]
                              properties:
                                type: { const: toolCall }
                                id: { type: string }
                                name: { type: string }
                                arguments: { type: object }
                      stopReason: { enum: [pending, stop, length, toolUse, error, aborted, deferred] }
                      errorMessage: { type: string }
        edges:
          - from: "0"
            to: $sink
            schema: *assistant
    "1":
      system: leaf
      prompt: Do your part.
      description: root member 1
      trigger: Start->1
    Join:
      kind: code
      description: Validates both root branches and retains the child's exact result.
  edges:
    - { from: Start, to: "0", schema: { type: "null" } }
    - { from: Start, to: "1", schema: { type: "null" } }
    - from: "0"
      to: Join
      schema: *assistant
    - from: "1"
      to: Join
      schema: *assistant
    - from: Join
      to: $sink
      schema: *assistant
