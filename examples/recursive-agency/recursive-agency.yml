graph:
  name: root
  nodes:
    Start:
      kind: emit
      text: Produce your branch's report.
      spec: A nonempty report from each leaf.
    "0":
      kind: graph
      trigger: Start->0
      description: root member 0
      graph:
        name: child
        source:
          routes: { "Start->0": ["$source~>0"] }
        nodes:
          "0":
            kind: graph
            trigger: "$source~>0"
            description: child member 0
            graph:
              name: grandchild
              source:
                routes: { "$source~>0": ["$source~>0"] }
              nodes:
                "0":
                  system: leaf
                  prompt: Complete the grandchild assignment in the following user message.
                  tool_block: &native_block [read, bash, edit, release, grep, find, ast_grep, ast_edit, diff, code_graph]
                  description: grandchild member 0
                  trigger: "$source~>0"
              edges:
                - from: $source
                  to: "0"
                  kind: message
                  schema: &assignment
                    type: object
                    required: [kind, text]
                    properties: { kind: { const: prompt }, text: { type: string } }
                - from: "0"
                  to: $sink
                  schema: &assistant
                    type: object
                    required: [role, content, stopReason]
                    properties:
                      role: { const: assistant }
                      content:
                        type: array
                        items:
                          anyOf:
                            - type: object
                              required: [type, text]
                              properties: { type: { const: text }, text: { type: string } }
                            - type: object
                              required: [type, thinking]
                              properties: { type: { const: thinking }, thinking: { type: string } }
                            - type: object
                              required: [type, id, name, arguments]
                              properties:
                                type: { const: toolCall }
                                id: { type: string }
                                name: { type: string }
                                arguments: { type: object }
                      stopReason: { enum: [pending, stop, length, toolUse, error, aborted, deferred] }
                      errorMessage: { type: string }
        edges:
          - { from: $source, to: "0", kind: message, schema: *assignment }
          - from: "0"
            to: $sink
            schema: *assistant
    "1":
      system: leaf
      prompt: Complete the sibling assignment in the following user message.
      tool_block: *native_block
      description: root member 1
      trigger: Start->1
    Join:
      kind: code
      description: Validates both root branches and retains the child's exact result.
  edges:
    - { from: Start, to: "0", id: Start->0, kind: message, schema: *assignment }
    - { from: Start, to: "1", id: Start->1, kind: message, schema: *assignment }
    - from: "0"
      to: Join
      schema: *assistant
    - from: "1"
      to: Join
      schema: *assistant
    - from: Join
      to: $sink
      schema: *assistant
