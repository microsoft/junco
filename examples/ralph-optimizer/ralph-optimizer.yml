# Optimize sort.c with workflows.ralph's topology plus the optimizer role and read/edit/bash.
# No graph termination: the runner measures every round; Ctrl-C stops the run.
graph:
  name: RalphOptimizer
  source:
    trigger: { any: [ingress-open, ingress-ack] }
    routes:
      assignment: ["$source~>Ralph"]
  sink:
    returns: Ralph
    trigger: { all: ["Ralph->$sink", ralph-accepted] }
  nodes:
    IngressOpen:
      kind: emit
      text: Admit the assignment.
      spec: One source delivery.
    RalphControl:
      kind: code
      trigger: { any: ["$source~>Ralph", ralph-complete] }
    Ralph:
      description: Edits sort.c each round; the runner keeps a round only when every test passes and the sort got faster.
      system: |
        You optimize the C function `sort` in the sort.c named in the assignment. Rules:
        - Change only `sort` and any helper functions it needs; never change `main`, the tests or the output format.
        - Implement the algorithm yourself: do not call qsort or any other library sort.
        - Start every round by reading sort.c: a round whose tests failed or that was slower than the best so far was reverted to the last accepted version before you were resumed.
        - After editing, compile and run with the exact command from the assignment; `./sort` prints `PASS <ms>` on success or `FAIL ...` on a wrong result.
        - Finish the round with a short report: what you changed and the `PASS` time you measured. Never claim a speedup you did not measure.
      trigger: "RalphControl~>Ralph"
      prompt: >-
        On the first round, achieve the objectives in the following task messages, in order.
        On phase "revise", take another try at the ordered objectives, building on your last
        answer in this session. On phase "retry", the previous attempt ended with a provider
        error: continue the same round from where you left off. Focus on depth: finish
        objectives well rather than attempting more of them. Return the complete answer.
  edges:
    - from: IngressOpen
      to: $source
      id: ingress-open
      kind: message
      schema: { type: object }
    - from: $source
      to: RalphControl
      id: "$source~>Ralph"
      kind: message
      schema: &task
        type: object
        required: [kind, text]
        properties:
          kind: { enum: [prompt, steer, followUp, nextTurn, error] }
          text: { type: string }
          images:
            type: array
            items:
              type: object
              required: [type, data, mimeType]
              properties:
                type: { const: image }
                data: { type: string }
                mimeType: { type: string }
    - from: RalphControl
      to: Ralph
      kind: message
      schema:
        anyOf:
          - *task
          - type: object
            required: [phase, round, objectives]
            properties:
              phase: { enum: [retry, revise] }
              round: { type: integer, minimum: 1 }
              objectives: { type: array, items: { type: string } }
    - from: Ralph
      to: RalphControl
      kind: message
      on: return
      id: ralph-complete
      schema: &assistant
        type: object
        required: [role, content, stopReason]
        properties:
          role: { const: assistant }
          content:
            type: array
            items:
              anyOf:
                - type: object
                  required: [type, text]
                  properties: { type: { const: text }, text: { type: string } }
                - type: object
                  required: [type, thinking]
                  properties: { type: { const: thinking }, thinking: { type: string } }
                - type: object
                  required: [type, id, name, arguments]
                  properties:
                    type: { const: toolCall }
                    id: { type: string }
                    name: { type: string }
                    arguments: { type: object }
          stopReason: { enum: [pending, stop, length, toolUse, error, aborted, deferred] }
          errorMessage: { type: string }
    - from: Ralph
      to: $sink
      schema: *assistant
    - from: RalphControl
      to: $sink
      id: ralph-accepted
      kind: message
      schema: &signal { type: boolean, const: true }
    - from: RalphControl
      to: $source
      id: ingress-ack
      kind: message
      schema: *signal
