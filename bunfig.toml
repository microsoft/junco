[install]
# Bun workspace: every internal package (packages/*) links to its workspace directory, so the
# engine, scheduler, agent, tools and Pi peers each have a single hoisted identity.
linker = "hoisted"

[test]
# Upstream grammar checkouts contain Node-addon tests; Junco links their C parsers directly.
pathIgnorePatterns = ["packages/junco-tools/crates/rust-graph/vendor/**"]
# `bun run test:coverage` reports agency source coverage only; each package proves its own
# implementation through its own suite.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/test/**",
  "**/tests/**",
  "**/examples/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
  "**/native/**",
  "**/packages/**",
]
