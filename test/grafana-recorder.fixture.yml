# Real Grafana Live smoke: nested leaves nodeId1::nodeId2::A and nodeId1::nodeId2::B.
graph:
  nodes:
    nodeId1:
      kind: graph
      graph:
        nodes:
          nodeId2:
            kind: graph
            graph:
              sink:
                returns: B
              nodes:
                A:
                  trigger: always
                  prompt: Allocate, edit src/a.ts, release it, and notify B.
                  tools: [bash, ast_edit, release]
                B:
                  trigger: always
                  prompt: Allocate, wait for A, then map the code graph.
                  tools: [bash, code_graph]
                  contracts:
                    "A~>B": One text prompt announcing that src/a.ts was edited and released.
              edges:
                - from: A
                  to: B
                  kind: message
                  schema:
                    type: object
                    required: [kind, text]
                    properties:
                      kind: { enum: [prompt, steer, followUp, nextTurn, error] }
                      text: { type: string }
                      images:
                        type: array
                        items:
                          type: object
                          required: [type, data, mimeType]
                          properties:
                            type: { const: image }
                            data: { type: string }
                            mimeType: { type: string }
                - from: A
                  to: $sink
                  schema: &assistant
                    type: object
                    required: [role, content, stopReason]
                    properties:
                      role: { const: assistant }
                      content:
                        type: array
                        items:
                          anyOf:
                            - type: object
                              required: [type, text]
                              properties: { type: { const: text }, text: { type: string } }
                            - type: object
                              required: [type, thinking]
                              properties: { type: { const: thinking }, thinking: { type: string } }
                            - type: object
                              required: [type, id, name, arguments]
                              properties:
                                type: { const: toolCall }
                                id: { type: string }
                                name: { type: string }
                                arguments: { type: object }
                      stopReason: { enum: [pending, stop, length, toolUse, error, aborted, deferred] }
                      errorMessage: { type: string }
                - { from: B, to: $sink, schema: *assistant }
        edges:
          - { from: nodeId2, to: $sink, schema: *assistant }
  edges:
    - { from: nodeId1, to: $sink, schema: *assistant }
