<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 704" width="1024" height="704" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Junco architecture</title>
  <desc id="arch-desc">junco depends on dataflow-engine, junco-scheduler and the Pi layer: junco-agent on pi-coding-agent, and junco-tools, whose tools are bash, read, edit, grep, find, diff, ast_grep, ast_edit, code_graph, release, send, yield, info, task, save_memory, search_memory and forget_memory. junco-tools calls the Rust crates marsh and rust-graph through a napi addon. marsh authorizes every event with junco-policy, whose core is verified with Verus, and hosts rmux-server, whose panes run brush-core shells inside Btrfs snapshots.</desc>
