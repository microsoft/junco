apiVersion: 1

datasources:
  - name: Junco Prometheus
    uid: junco-prometheus
    orgId: 1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.15.1
      timeInterval: 1s
