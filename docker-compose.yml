name: junco-telemetry

services:
  iggy:
    image: apache/iggy:0.10.0
    restart: unless-stopped
    ports:
      - "${JUNCO_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    env_file: ${HOME}/.config/junco/iggy.env
    environment:
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_NODE_ADVERTISED_ADDRESS: ${JUNCO_IGGY_ADVERTISED_ADDRESS:-localhost}
      IGGY_SHARDING_CPU_ALLOCATION: "1"
    # Iggy's io_uring runtime is blocked by Docker's default seccomp profile.
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      memlock: -1
    volumes:
      - iggy_data:/app/local_data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    ports:
      - "${JUNCO_BIND_ADDRESS:-127.0.0.1}:8001:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - prometheus_data:/prometheus
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  grafana:
    image: ${JUNCO_GRAFANA_IMAGE:-grafana/grafana:13.3.0}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: ${JUNCO_GRAFANA_ROOT_URL:-http://localhost:8000/}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./telemetry/grafana-datasources.yml:/etc/grafana/provisioning/datasources/junco.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  grafana-proxy:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    ports:
      - "${JUNCO_BIND_ADDRESS:-127.0.0.1}:8000:80"
    depends_on:
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    volumes:
      - ./telemetry/grafana-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  iggy_data:
  grafana_data:
    external: true
    name: grafana_data
  prometheus_data:
    name: junco-telemetry_prometheus_data
