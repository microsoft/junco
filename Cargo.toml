[package]
name = "junco-tools-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib"]

[features]
default = []
test-fs = ["dep:marsh-btrfs", "marsh-btrfs/fake"]

[dependencies]
napi = { version = "=3.9.0", default-features = false, features = ["napi4", "tokio_rt", "dyn-symbols"] }
# Cargo.lock keeps napi-derive-backend at 5.0.4 for napi 3.9 codegen compatibility.
napi-derive = "=3.5.6"
marsh-core = { git = "ssh://git@github.com/junco-org/marsh.git", rev = "57c258de2deb113eba65d00664cadc4716f60cd1" }
marsh-btrfs = { git = "ssh://git@github.com/junco-org/marsh.git", rev = "57c258de2deb113eba65d00664cadc4716f60cd1", optional = true }
brush-core = "=0.5.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }

[build-dependencies]
napi-build = "=2.3.2"

[patch.crates-io]
brush-core = { git = "ssh://git@github.com/junco-org/marsh.git", rev = "57c258de2deb113eba65d00664cadc4716f60cd1" }
