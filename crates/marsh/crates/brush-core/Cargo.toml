# Vendored from https://github.com/reubeno/brush brush-core 0.5.0 (crates.io), plus the
# ExternalCommandSpawner seam of https://github.com/reubeno/brush/pull/1382 and a generic
# ExecutionObserver seam (extensions.rs) that brackets builtins, the shell's code-running entry
# points and every task it schedules. Also adds per-pipeline Linux cgroup v2 resource control
# and monitoring (resources.rs). Redirected onto crates.io's brush-core by the root
# [patch.crates-io]; delete this crate once the seams and resource API ship upstream.
[package]
name = "brush-core"
description = "Reusable core of a POSIX/bash shell (used by brush-shell)"
version = "0.5.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/reubeno/brush"
authors = ["reuben olinsky"]

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "brush-parser/serde", "rpds/serde", "chrono/serde"]
experimental-parser = ["brush-parser/winnow-parser"]

[dependencies]
async-recursion = "1.2.0"
async-trait = "0.1.92"
brush-parser = "^0.4.0"
bon = "3.10.3"
cached = "4.0.3"
cfg-if = "1.0.5"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
color-print = "0.3.7"
# Stock brush-builtins 0.2.0 propagates this error into brush-core's public ErrorKind.
# Keep its fancy-regex minor identity until the released Brush family advances together.
fancy-regex = "0.17.0"
futures = "0.3.34"
inherent = "1.0.14"
itertools = "0.15.0"
normalize-path = "0.2.2"
rand = "0.10.3"
rpds = "1.2.1"
serde = { version = "1.0.229", optional = true, features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "sync"] }

[target.'cfg(any(unix, windows))'.dependencies]
hostname = "0.4.2"
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[target.'cfg(windows)'.dependencies]
check_elevation = "0.3.0"
whoami = "2.1.3"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.3"
libc = "0.2.191"
nix = { version = "0.31.3", features = [
    "fs",
    "poll",
    "process",
    "resource",
    "signal",
    "term",
    "user",
] }
terminfo = "0.9.0"
uzers = "0.12.2"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.29.0", features = ["js"] }

[dev-dependencies]
anyhow = "1.0.104"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile = "3.27.0"
