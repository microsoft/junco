[package]
name = "junco-tools-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib"]

[features]
default = []
test-fs = ["marsh-core/testing"]

[dependencies]
napi = { version = "=3.13.0", default-features = false, features = ["napi4", "tokio_rt", "dyn-symbols"] }
napi-derive = "=3.6.9"
marsh-core = { git = "https://github.com/junco-org/marsh.git", rev = "1f2b85cea55e2ebf9670fa627d82e3b20ea55954" }
marsh-btrfs = { git = "https://github.com/junco-org/marsh.git", rev = "1f2b85cea55e2ebf9670fa627d82e3b20ea55954" }
brush-core = "=0.5.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "=0.29.0"

# Unmodified Oh My Pi engines, imported from a pinned public Git revision.
pi-ast = { git = "https://github.com/can1357/oh-my-pi.git", rev = "7ae76f8e4daca0c8f409f61bcd514260cd522365" }
pi-diff = { git = "https://github.com/can1357/oh-my-pi.git", rev = "7ae76f8e4daca0c8f409f61bcd514260cd522365" }
pi-walker = { git = "https://github.com/can1357/oh-my-pi.git", rev = "7ae76f8e4daca0c8f409f61bcd514260cd522365" }
pi-edit = { git = "https://github.com/can1357/oh-my-pi.git", rev = "7ae76f8e4daca0c8f409f61bcd514260cd522365" }

# Direct dependencies of the transplanted pi-natives binding/grep modules.
async-trait = "0.1"
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
flume = "0.12"
globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
heapless = "0.9"
parking_lot = "0.12.5"
regex = "1"
smallvec = { version = "1.16.2", features = ["serde", "write", "union", "const_new"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "=2.5.0"

[patch.crates-io]
brush-core = { git = "https://github.com/junco-org/marsh.git", rev = "1f2b85cea55e2ebf9670fa627d82e3b20ea55954" }
brush-interactive = { git = "https://github.com/junco-org/marsh.git", rev = "1f2b85cea55e2ebf9670fa627d82e3b20ea55954" }
