[package]
name = "rust-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]

[dependencies]
pi-ast = { git = "https://github.com/can1357/oh-my-pi.git", rev = "7ae76f8e4daca0c8f409f61bcd514260cd522365" }
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
ignore = "0.4"
rayon = "1"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"
