[package]
name = "rust-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]

[dependencies]
pi-ast = { git = "https://github.com/can1357/oh-my-pi.git", rev = "093275112f7adff207608673c0e33c7f3d16e27f" }
ast-grep-core = { version = "0.39.9", default-features = false, features = ["tree-sitter"] }
tree-sitter = "0.25.10"
tree-sitter-language = "0.1.9"
ignore = "0.4.34"
rayon = "1.12.0"
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[build-dependencies]
# pi-ast's linked SQL grammar requires cc ~1.2.1 across this dependency graph.
cc = "1.2.67"

[dev-dependencies]
tempfile = "3.27.0"
