[package]
name = "junco-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
marsh-core = { path = "../../../../crates/marsh/crates/marsh-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "process", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
regex = "1.13.1"
futures-util = "0.3.34"
lsp-types = "0.97.0"
url = "2.5.8"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
marsh-core = { path = "../../../../crates/marsh/crates/marsh-core", features = ["testing"] }
marsh-btrfs = { path = "../../../../crates/marsh/crates/marsh-btrfs" }
tempfile = "3.27.0"
